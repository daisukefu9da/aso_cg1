<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>vanta.js waves</title>
    <style>
        body {
            margin: 0;
        }
        #vanta-bg {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="vanta-bg"></div>

    <!-- ① three.js を先に読み込む -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <!-- ② vanta.js（waves）を読み込む -->
    <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.waves.min.js"></script>
    <!-- ③ どこに表示するかを指定して動かす -->
    <script>
        VANTA.WAVES({
            el: "#vanta-bg",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00
        });
    </script>
</body>
</html>
