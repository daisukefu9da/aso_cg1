<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>KOMUGI BAKERY</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <p class="logo">KOMUGI BAKERY</p>
        <nav class="nav">
            <ul>
                <li><a href="#news">お知らせ</a></li>
                <li><a href="#osusume">おすすめ</a></li>
                <li><a href="#info">店舗情報</a></li>
            </ul>
        </nav>
    </header>

    <h1>焼きたてのパンをどうぞ</h1>

    <main>
        <h2 id="news">お知らせ</h2>
        <ul>
            <li>11月から冬の新作パンが登場します</li>
            <li>12月31日〜1月3日はお休みです</li>
            <li>サンドイッチは11時から並びます</li>
        </ul>

        <h2 id="osusume">おすすめのパン</h2>
        <div class="bread-list">
            <div class="bread">
                <img src="images/item1.jpg" alt="クロワッサン">
                <p>クロワッサン<br>¥280</p>
            </div>
            <div class="bread">
                <img src="images/item2.jpg" alt="メロンパン">
                <p>メロンパン<br>¥220</p>
            </div>
            <div class="bread">
                <img src="images/item3.jpg" alt="カレーパン">
                <p>カレーパン<br>¥260</p>
            </div>
        </div>

        <h2 id="info">店舗情報</h2>
        <table>
            <tr>
                <th>住所</th>
                <td>福岡県北九州市〇〇町1-2-3</td>
            </tr>
            <tr>
                <th>営業時間</th>
                <td>7:00〜18:00</td>
            </tr>
            <tr>
                <th>定休日</th>
                <td>毎週水曜日</td>
            </tr>
        </table>
    </main>

    <footer>
        <p class="copy">&copy; KOMUGI BAKERY</p>
    </footer>
</body>
</html>
